        <link rel='stylesheet' href='styles.css'>                                                                           <!-- External CSS          -->
        <link rel="stylesheet" href="com.css">
        <script src='script.js' defer></script>                                                                             <!-- External JS           -->
        <script src="posts.js" defer></script>
    </head>
    <body>
        <audio id="myAudio" src="resources/mixkit-cool-interface-click-tone-2568.wav" preload="auto"></audio>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">Home</a>

                <!-- Hamburger button -->
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav"
                        aria-controls="navbarNav"
                        aria-expanded="false"
                        aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar links -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto gap-3">
                        <li class="nav-item">
                            <a class="nav-link" href="fishing.html">About Fishing</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="experiences.html">Experiences</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="#">Community</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="feedback.html">Feedback</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
        <br><br><br>

        <section class="cardholder" id="cardholder">

        </section>

        <button class="new-post position-fixed bottom-0 end-0 m-4" data-bs-toggle="modal" data-bs-target="#myFormModal">
            <i class="bi bi-plus-lg"></i>
        </button>

        <section class="py-1 container-end" style="position: relative; z-index: 6;">
            <div class="container">
                <div class="text-center">
                    
                    <ul class="d-flex flex-row justify-content-center list-unstyled gap-3 mb-0 mt-2">
                        <li><a class="text-decoration-none link-light bold-on-hover" target="_blank" 
                        href="https://www.termsfeed.com/live/488f4d1d-3a2f-4811-86fa-00bd6d591c84">Privacy Policy</a></li>
                        <li><p>|</p></li>
                        <li><a class="text-decoration-none link-light bold-on-hover" target="_blank" 
                        href="https://www.termsfeed.com/live/a16371e5-0a06-42fc-8c76-aa843c2b8efe">Terms of Use</a></li>
                    </ul>

                </div>
            </div>
        </section>

        <div class="modal fade" id="myFormModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h3 class="modal-title">New Post</h3>
                    </div>

                    <form id="newPost">

                        <div class="modal-body">

                            <div class="mb-3">
                                <label for="form-title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="form-title" name="title" required>
                            </div>

                            <div>
                                <label for="form-img" class="form-label">Upload media</label>
                                <input type="file" class="form-control" id="form-img" name="img">
                            </div>

                            <div id="img-preview-container" style="display: none;">
                                <img id="img-preview" class="img-fluid rounded" alt="Image preview">

                                <div class="mt-3" id="insert-img-alt-text">
                                    <input type="text" class="form-control" id="img-alt-text" name="alt-text" placeholder="Add description">
                            </div>
                            </div>

                            <div class="mt-5">
                                <textarea class="form-control" id="form-text" name="text" rows="7" placeholder="What's today's catch?" required></textarea>
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button type="reset" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <a href="feedback.html" class="btn btn-success feedback-tab">Feedback</a>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
